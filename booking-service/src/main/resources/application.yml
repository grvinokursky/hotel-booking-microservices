server:
  port: 8082

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:h2:mem:bookingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
  h2:
    console:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: "my-super-secret-key-for-hotel-booking-system-hs256-must-be-at-least-32-bytes"
  expiration-ms: 3600000

feign:
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 5000
        loggerLevel: basic

resilience4j:
  retry:
    instances:
      hotelService:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - feign.RetryableException
          - feign.FeignException$ServiceUnavailable
          - feign.FeignException$GatewayTimeout
          - feign.FeignException$InternalServerError
      hotelRelease:
        maxAttempts: 2
        waitDuration: 300ms
  circuitbreaker:
    instances:
      hotelService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}] [bookingId:%X{bookingId:-}]"
